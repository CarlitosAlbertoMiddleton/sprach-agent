<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self'; media-src blob:; connect-src 'self' https://*.speech.microsoft.com wss://*.speech.microsoft.com">
  <title>Sprach-Agent</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="session.css">
</head>
<body class="session">
  <header class="session-head">
    <div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="state" id="state" data-state="starting">
      <span class="dot" aria-hidden="true"></span>
      <span id="stateLabel">Starte…</span>
    </div>
    <div class="meter" aria-hidden="true"><span id="level"></span></div>
  </header>

  <main class="transcript" id="transcript" aria-live="polite"></main>

  <p class="partial" id="partial"></p>
  <p class="status err" id="error" hidden></p>

  <footer class="session-foot">
    <span class="hint" id="hint">Sag „Ende“ zum Beenden, „Pause“ zum Anhalten.</span>
    <div class="buttons">
      <button type="button" id="pause">Pause</button>
      <button type="button" class="primary" id="end">Ende</button>
    </div>
  </footer>

  <script src="vendor/speech-sdk.js"></script>
  <script type="module" src="session.js"></script>
</body>
</html>
